    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>
  </noscript>

<body>
  <div id="__bundler_placeholder">Loading NetPrevê — previsão da qualidade da internet...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

splay: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 16px\">\n<a href=\"#como-funciona\" style=\"color: #DCE7F7; text-decoration: none\">Como funciona<\u002Fa>\n<a href=\"#qualidade\" style=\"color: #DCE7F7; text-decoration: none\">Boa, Moderada ou Instável<\u002Fa>\n<a href=\"#atividades\" style=\"color: #DCE7F7; text-decoration: none\">Atividades<\u002Fa>\n<a href=\"#tecnologia\" style=\"color: #DCE7F7; text-decoration: none\">Por dentro<\u002Fa>\n<a href=\"#equipe\" style=\"color: #DCE7F7; text-decoration: none\">Equipe<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"inicio\" style=\"background: #13294B; color: #FFFFFF; padding: 40px 0 88px\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n<div style=\"flex: 1 1 480px; min-width: 0\">\n<h1 style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(40px, 5.4vw, 68px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 24px\">Saiba antes se a sua internet vai aguentar.<\u002Fh1>\n<p style=\"font-size: 21px; line-height: 1.55; color: #DCE7F7; margin: 0 0 32px; max-width: 34em\">O NetPrevê mostra como deve estar a conexão perto de você nas próximas horas e diz, em linguagem simples, se dá para fazer uma chamada de vídeo, assistir a um streaming ou enviar um arquivo naquele horário.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<a href=\"https://github.com/DanielDornelas/netpreve-app\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-weight: 700; text-decoration: none\">Ver o código do app<\u002Fa>\n<a href=\"https://github.com/DanielDornelas/connectivity-forecast-squad-15\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 12px; border: 2px solid #6F8DB8; color: #FFFFFF; font-weight: 600; text-decoration: none\">Ver o código da API<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<figure aria-label=\"Previsão das próximas horas em 20/08: das 13h às 18h a conexão fica entre Moderada e Instável; o melhor horário da faixa é 19/08 às 23:00, com qualidade Boa\" style=\"flex: 1 1 400px; min-width: 0; margin: 0; background: #FFFFFF; color: #14213D; border-radius: 22px; padding: 28px 28px 24px; box-shadow: 0 30px 60px rgba(5, 15, 35, 0.35)\">\n<div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px\">\n<p style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 0\">Próximas horas<\u002Fp>\n<p style=\"font-size: 15px; color: #4A5B78; margin: 0\">Ponto de medição a 41,1 km<\u002Fp>\n<\u002Fdiv>\n<p style=\"font-size: 15px; color: #4A5B78; margin: 0 0 22px\">20/08, tempo de resposta previsto em cada horário<\u002Fp>\n<div style=\"display: flex; align-items: flex-end; gap: 10px; height: 170px\">\n<sc-for list=\"{{hours}}\" as=\"h\" hint-placeholder-count=\"6\">\n<div style=\"flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end\">\n<div style=\"width: 100%; max-width: 44px; height: {{h.height}}; background: {{h.color}}; border-radius: 10px\"><\u002Fdiv>\n<span style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 15px\">{{h.label}}<\u002Fspan>\n<span style=\"font-size: 13px; color: #4A5B78; margin-top: -8px\">{{h.ms}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top: 22px; padding: 14px 16px; border-radius: 14px; background: #E3F2EE; display: flex; gap: 12px; align-items: center\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"#187264\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z\"><\u002Fpath><\u002Fsvg>\n<p style=\"margin: 0; font-size: 16px\"><strong>Melhor horário: 19/08 às 23:00.<\u002Fstrong> Qualidade Boa, com 23 ms de tempo de resposta.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"problema-titulo\" style=\"padding: 88px 0 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 32px 72px\">\n<h2 id=\"problema-titulo\" style=\"flex: 1 1 340px; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0\">A gente só descobre que a internet está ruim quando a chamada cai.<\u002Fh2>\n<div style=\"flex: 1 1 480px; min-width: 0\">\n<p style=\"margin: 0 0 18px\">Quem estuda ou trabalha online depende da conexão em horários marcados: a aula ao vivo, a reunião com o cliente, o envio de um trabalho no último minuto. Os testes de velocidade mostram como a internet está agora, mas não dizem como ela vai estar daqui a algumas horas.<\u002Fp>\n<p style=\"margin: 0\">O NetPrevê responde a essa pergunta antes. Ele usa previsões feitas por modelos a partir de medições de pontos de referência e traduz os números em algo que qualquer pessoa entende: uma palavra, uma cor e um conselho do que fazer.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"como-funciona\" aria-labelledby=\"como-titulo\" style=\"padding: 72px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px\">\n<h2 id=\"como-titulo\" style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px\">Como funciona<\u002Fh2>\n<p style=\"margin: 0 0 44px; max-width: 40em; color: #33445F\">Quatro passos, do primeiro toque até a resposta que importa.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px\">\n<div style=\"flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<img src=\"a6f6e13d-88ad-4382-8dba-ea341f5c6223\" alt=\"Tela do app com a lista dos modelos de previsão A, B, C e D\" style=\"width: 100%; max-width: 250px; align-self: center\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"flex: 0 0 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #FFFFFF; font-family: 'Lexend', sans-serif; font-weight: 700; display: flex; align-items: center; justify-content: center\">1<\u002Fspan>\n<div><h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 4px 0 6px\">Escolha um modelo<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #33445F\">Cada modelo de previsão foi feito por um grupo diferente. A escolha fica salva no aparelho e pode ser trocada depois.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<img src=\"234efc43-6bbf-4478-abe8-d9ee9569c394\" alt=\"Tela de previsão: qualidade Moderada, 73 ms de tempo de resposta, 3,9% de perda de pacotes e a recomendação Reduza o uso de rede\" style=\"width: 100%; max-width: 250px; align-self: center\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"flex: 0 0 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #FFFFFF; font-family: 'Lexend', sans-serif; font-weight: 700; display: flex; align-items: center; justify-content: center\">2<\u002Fspan>\n<div><h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 4px 0 6px\">Veja a previsão perto de você<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #33445F\">Com a sua permissão, o app encontra o ponto de medição mais próximo e mostra a qualidade, o tempo de resposta, a perda de pacotes e o que fazer.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<img src=\"edc73746-f436-4bf4-be44-f2831b1d3b58\" alt=\"Faixa das próximas horas com colunas coloridas por qualidade e o melhor horário em destaque\" style=\"width: 100%; max-width: 250px; align-self: center\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"flex: 0 0 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #FFFFFF; font-family: 'Lexend', sans-serif; font-weight: 700; display: flex; align-items: center; justify-content: center\">3<\u002Fspan>\n<div><h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 4px 0 6px\">Confira as próximas horas<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #33445F\">A previsão hora a hora aparece em uma faixa, com o melhor horário em destaque. Um toque seleciona o horário que você quer.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<img src=\"8262c37e-e299-4efb-8243-aa6705280953\" alt=\"Verificação de chamada de vídeo às 15h com o resultado Melhor escolher outro horário\" style=\"width: 100%; max-width: 250px; align-self: center\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"flex: 0 0 36px; height: 36px; border-radius: 50%; background: {{accent}}; color: #FFFFFF; font-family: 'Lexend', sans-serif; font-weight: 700; display: flex; align-items: center; justify-content: center\">4<\u002Fspan>\n<div><h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 4px 0 6px\">Pergunte se dá para fazer<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #33445F\">Escolha a atividade e toque em verificar. O app responde “Bom momento para isso” ou “Melhor escolher outro horário”.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"qualidade\" aria-labelledby=\"qualidade-titulo\" style=\"background: #FFFFFF; padding: 88px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px\">\n<h2 id=\"qualidade-titulo\" style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px\">Boa, Moderada ou Instável<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 42em; color: #33445F\">Em vez de números soltos, a previsão vira uma de três palavras. Elas vêm de duas medidas da rede: o tempo de resposta, que é quanto um sinal leva para ir e voltar, e a perda de pacotes, que é quanto da informação se perde no caminho. A pior das duas decide a qualidade.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; border-radius: 20px; overflow: hidden\">\n<div style=\"flex: 1 1 260px; min-width: 0; background: #187264; color: #FFFFFF; padding: 30px 28px\">\n<div style=\"display: flex; align-items: flex-end; gap: 5px; height: 30px; margin-bottom: 18px\" aria-hidden=\"true\"><span style=\"width: 9px; height: 12px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 20px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 30px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 32px; margin: 0 0 6px\">Boa<\u002Fh3>\n<p style=\"margin: 0 0 16px; font-size: 17px\">Conexão prevista adequada para qualquer atividade.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; color: #E2F4EF\">Menos de 60 ms de tempo de resposta e menos de 1% de perda.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; background: #A86412; color: #FFFFFF; padding: 30px 28px\">\n<div style=\"display: flex; align-items: flex-end; gap: 5px; height: 30px; margin-bottom: 18px\" aria-hidden=\"true\"><span style=\"width: 9px; height: 12px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 20px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 30px; background: rgba(255,255,255,0.35); border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 32px; margin: 0 0 6px\">Moderada<\u002Fh3>\n<p style=\"margin: 0 0 16px; font-size: 17px\">Pode haver instabilidade. O app sugere reduzir o uso de rede.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; color: #FBEBD6\">De 60 a 149 ms, ou de 1% a menos de 5% de perda.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; background: #B8323F; color: #FFFFFF; padding: 30px 28px\">\n<div style=\"display: flex; align-items: flex-end; gap: 5px; height: 30px; margin-bottom: 18px\" aria-hidden=\"true\"><span style=\"width: 9px; height: 12px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 20px; background: rgba(255,255,255,0.35); border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 30px; background: rgba(255,255,255,0.35); border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 32px; margin: 0 0 6px\">Instável<\u002Fh3>\n<p style=\"margin: 0 0 16px; font-size: 17px\">Risco de quedas. O app sugere preparar conteúdo offline.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; color: #FBE3E5\">150 ms ou mais, ou 5% de perda ou mais.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 24px 0 0; font-size: 16px; color: #33445F; max-width: 46em\">No app, a qualidade nunca depende só da cor: a palavra, as barrinhas de sinal e a cor aparecem sempre juntas.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"atividades\" aria-labelledby=\"atividades-titulo\" style=\"padding: 88px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 460px; min-width: 0\">\n<h2 id=\"atividades-titulo\" style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px\">Vai dar para fazer?<\u002Fh2>\n<p style=\"margin: 0 0 28px; color: #33445F\">Cada atividade exige uma qualidade mínima. O app compara a previsão do horário escolhido com essa exigência.<\u002Fp>\n<div style=\"overflow-x: auto\">\n<sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 17px; min-width: 360px\">\n<sc-raw-caption style=\"text-align: left; font-size: 15px; color: #4A5B78; padding-bottom: 10px\">Qualidade mínima de cada atividade<\u002Fsc-raw-caption>\n<sc-raw-thead>\n<sc-raw-tr><sc-raw-th scope=\"col\" style=\"text-align: left; padding: 12px 14px; border-bottom: 2px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 600\">Atividade<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"text-align: left; padding: 12px 14px; border-bottom: 2px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 600\">Precisa de<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Chamada de vídeo<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #187264\">Boa<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Streaming<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #187264\">Boa<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Chamada de voz<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #8F540E\">Moderada<\u002Fstrong> ou melhor<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Envio de arquivos<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #8F540E\">Moderada<\u002Fstrong> ou melhor<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Navegação<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #8F540E\">Moderada<\u002Fstrong> ou melhor<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 12px 14px\">Mensagens<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 14px\">Qualquer qualidade<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center\">\n<img src=\"8262c37e-e299-4efb-8243-aa6705280953\" alt=\"Resultado da verificação: chamada de vídeo às 15h, qualidade prevista Instável, melhor escolher outro horário\" style=\"width: 46%; min-width: 180px; max-width: 250px\">\n<img src=\"44d75aa6-56b4-428a-9407-6d192e903849\" alt=\"Comparação dos modelos A, B, C e D para o mesmo horário, sem declarar vencedor\" style=\"width: 46%; min-width: 180px; max-width: 250px\">\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width: 1160px; margin: 40px auto 0; padding: 0 24px\">\n<p style=\"margin: 0; max-width: 46em; color: #33445F\">Na dúvida, compare: o app mostra o que os quatro modelos preveem para o mesmo local e horário, lado a lado, sem eleger um vencedor. As diferenças mostram como as abordagens divergem, não qual está certa.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tecnologia\" aria-labelledby=\"tecnologia-titulo\" style=\"background: #13294B; color: #FFFFFF; padding: 88px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px\">\n<h2 id=\"tecnologia-titulo\" style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px\">Por dentro do NetPrevê<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 44em; color: #DCE7F7\">O produto tem duas partes: o aplicativo, que o usuário usa, e a API, que guarda as previsões e aplica as regras de qualidade.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; align-items: stretch; gap: 16px\">\n<div style=\"flex: 1 1 260px; min-width: 0; border: 2px solid #3E5C8A; border-radius: 18px; padding: 24px\">\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 22px; margin: 0 0 8px\">Aplicativo<\u002Fh3>\n<p style=\"margin: 0 0 14px; color: #DCE7F7; font-size: 16px\">React Native com Expo. Roda no Android, no iPhone e no navegador. Um único serviço conversa com a API, com tempo limite de 60 segundos e mensagens de erro que dizem o que fazer.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #B9CBE6\">React Native, Expo, JavaScript, expo-location<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0 4px\" aria-hidden=\"true\">\n<svg width=\"40\" height=\"24\" sc-camel-view-box=\"0 0 40 24\" fill=\"none\" stroke=\"#8DB8F2\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12h34M28 4l8 8-8 8\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; border: 2px solid #3E5C8A; border-radius: 18px; padding: 24px\">\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 22px; margin: 0 0 8px\">API de previsão<\u002Fh3>\n<p style=\"margin: 0 0 14px; color: #DCE7F7; font-size: 16px\">Java com Spring Boot, em camadas: o controller recebe o pedido, o service aplica as regras de classificação e o repository lê e valida os dados.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #B9CBE6\">Java 17, Spring Boot, Maven, REST em /api/v1<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; border: 2px solid #3E5C8A; border-radius: 18px; padding: 24px\">\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 22px; margin: 0 0 8px\">Qualidade e documentação<\u002Fh3>\n<p style=\"margin: 0 0 14px; color: #DCE7F7; font-size: 16px\">Contrato documentado com Swagger, testes automatizados com JUnit e Mockito e cobertura medida com JaCoCo. O README de cada repositório explica como rodar.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #B9CBE6\">Swagger, JUnit, Mockito, JaCoCo, GitHub, Jira<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 40px; padding: 22px 24px; border-radius: 16px; background: #1D3A66; display: flex; gap: 16px; align-items: flex-start\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFD27A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: 0 0 auto; margin-top: 2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5M12 16.5v.5\"><\u002Fpath><\u002Fsvg>\n<p style=\"margin: 0; color: #EAF1FB; font-size: 17px\"><strong>Os dados são de exemplo.<\u002Fstrong> Nesta versão acadêmica, a API usa previsões fixas e fictícias. A previsão é ligada a um ponto de medição de referência e não mede a rede do seu aparelho, e o app mostra esse aviso na tela.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"equipe\" aria-label=\"Equipe\" style=\"padding: 88px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 40px 72px\">\n<ul style=\"flex: 1 1 420px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column\">\n<li style=\"padding: 16px 0; border-bottom: 1px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Daniel da Silva Dornelas<\u002Fli>\n<li style=\"padding: 16px 0; border-bottom: 1px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Melissa Alves dos Santos<\u002Fli>\n<li style=\"padding: 16px 0; border-bottom: 1px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Samuel Conceição de Souza<\u002Fli>\n<li style=\"padding: 16px 0; border-bottom: 1px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Vinícius Araújo Alves<\u002Fli>\n<li style=\"padding: 16px 0; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Alexander Penninches Iwanami<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #0E1F3A; color: #DCE7F7; padding: 40px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px\">\n<p style=\"margin: 0; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 20px; color: #FFFFFF\">NetPrevê<\u002Fp>\n<nav aria-label=\"Repositórios\" style=\"display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 16px\">\n<a href=\"https://github.com/DanielDornelas/netpreve-app\" style=\"color: #BFD6F7\">Repositório do aplicativo<\u002Fa>\n<a href=\"https://github.com/DanielDornelas/connectivity-forecast-squad-15\" style=\"color: #BFD6F7\">Repositório da API<\u002Fa>\n<\u002Fnav>\n<p style=\"margin: 0; font-size: 15px; color: #A9BCD8\">Projeto acadêmico, licença MIT.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; color: #14213D; background: #EEF3F8; font-size: 18px; line-height: 1.6\" data-canvas-width=\"1440\" data-canvas-height=\"6400\" data-document-role=\"page\" data-label=\"Site do NetPrevê\">\n\n<header style=\"background: #13294B; color: #FFFFFF\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#inicio\" style=\"display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none\">\n<svg width=\"34\" height=\"28\" viewBox=\"0 0 34 28\" aria-hidden=\"true\"><rect x=\"0\" y=\"16\" width=\"8\" height=\"12\" rx=\"3\" fill=\"#4F86D9\"><\u002Frect><rect x=\"13\" y=\"8\" width=\"8\" height=\"20\" rx=\"3\" fill=\"#6FA0EA\"><\u002Frect><rect x=\"26\" y=\"0\" width=\"8\" height=\"28\" rx=\"3\" fill=\"#9CC3FF\"><\u002Frect><\u002Fsvg>\n<span style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.01em\">NetPrevê<\u002Fspan>\n<\u002Fa>\n<nav aria-label=\"Seções do site\" style=\"display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 16px\">\n<a href=\"#como-funciona\" style=\"color: #DCE7F7; text-decoration: none\">Como funciona<\u002Fa>\n<a href=\"#qualidade\" style=\"color: #DCE7F7; text-decoration: none\">Boa, Moderada ou Instável<\u002Fa>\n<a href=\"#atividades\" style=\"color: #DCE7F7; text-decoration: none\">Atividades<\u002Fa>\n<a href=\"#tecnologia\" style=\"color: #DCE7F7; text-decoration: none\">Por dentro<\u002Fa>\n<a href=\"#equipe\" style=\"color: #DCE7F7; text-decoration: none\">Equipe<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"inicio\" style=\"background: #13294B; color: #FFFFFF; padding: 40px 0 88px\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n<div style=\"flex: 1 1 480px; min-width: 0\">\n<h1 style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(40px, 5.4vw, 68px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 24px\">Saiba antes se a sua internet vai aguentar.<\u002Fh1>\n<p style=\"font-size: 21px; line-height: 1.55; color: #DCE7F7; margin: 0 0 32px; max-width: 34em\">O NetPrevê mostra como deve estar a conexão perto de você nas próximas horas e diz, em linguagem simples, se dá para fazer uma chamada de vídeo, assistir a um streaming ou enviar um arquivo naquele horário.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<a href=\"https://github.com/DanielDornelas/netpreve-app\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 12px; background: #1E5FAA; color: #FFFFFF; font-weight: 700; text-decoration: none\">Ver o código do app<\u002Fa>\n<a href=\"https://github.com/DanielDornelas/connectivity-forecast-squad-15\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 12px; border: 2px solid #6F8DB8; color: #FFFFFF; font-weight: 600; text-decoration: none\">Ver o código da API<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<figure aria-label=\"Previsão das próximas horas em 20/08: das 13h às 18h a conexão fica entre Moderada e Instável; o melhor horário da faixa é 19/08 às 23:00, com qualidade Boa\" style=\"flex: 1 1 400px; min-width: 0; margin: 0; background: #FFFFFF; color: #14213D; border-radius: 22px; padding: 28px 28px 24px; box-shadow: 0 30px 60px rgba(5, 15, 35, 0.35)\">\n<div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px\">\n<p style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 0\">Próximas horas<\u002Fp>\n<p style=\"font-size: 15px; color: #4A5B78; margin: 0\">Ponto de medição a 41,1 km<\u002Fp>\n<\u002Fdiv>\n<p style=\"font-size: 15px; color: #4A5B78; margin: 0 0 22px\">20/08, tempo de resposta previsto em cada horário<\u002Fp>\n<div style=\"display: flex; align-items: flex-end; gap: 10px; height: 170px\">\n\n<div style=\"flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end\">\n<div style=\"width: 100%; max-width: 44px; height: ; background: ; border-radius: 10px\"><\u002Fdiv>\n<span style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 15px\">{{h.label}}<\u002Fspan>\n<span style=\"font-size: 13px; color: #4A5B78; margin-top: -8px\">{{h.ms}}<\u002Fspan>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<div style=\"margin-top: 22px; padding: 14px 16px; border-radius: 14px; background: #E3F2EE; display: flex; gap: 12px; align-items: center\">\n<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"#187264\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z\"><\u002Fpath><\u002Fsvg>\n<p style=\"margin: 0; font-size: 16px\"><strong>Melhor horário: 19/08 às 23:00.<\u002Fstrong> Qualidade Boa, com 23 ms de tempo de resposta.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"problema-titulo\" style=\"padding: 88px 0 24px\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 32px 72px\">\n<h2 id=\"problema-titulo\" style=\"flex: 1 1 340px; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0\">A gente só descobre que a internet está ruim quando a chamada cai.<\u002Fh2>\n<div style=\"flex: 1 1 480px; min-width: 0\">\n<p style=\"margin: 0 0 18px\">Quem estuda ou trabalha online depende da conexão em horários marcados: a aula ao vivo, a reunião com o cliente, o envio de um trabalho no último minuto. Os testes de velocidade mostram como a internet está agora, mas não dizem como ela vai estar daqui a algumas horas.<\u002Fp>\n<p style=\"margin: 0\">O NetPrevê responde a essa pergunta antes. Ele usa previsões feitas por modelos a partir de medições de pontos de referência e traduz os números em algo que qualquer pessoa entende: uma palavra, uma cor e um conselho do que fazer.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"como-funciona\" aria-labelledby=\"como-titulo\" style=\"padding: 72px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px\">\n<h2 id=\"como-titulo\" style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px\">Como funciona<\u002Fh2>\n<p style=\"margin: 0 0 44px; max-width: 40em; color: #33445F\">Quatro passos, do primeiro toque até a resposta que importa.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px\">\n<div style=\"flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<img src=\"a6f6e13d-88ad-4382-8dba-ea341f5c6223\" alt=\"Tela do app com a lista dos modelos de previsão A, B, C e D\" style=\"width: 100%; max-width: 250px; align-self: center\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"flex: 0 0 36px; height: 36px; border-radius: 50%; background: #1E5FAA; color: #FFFFFF; font-family: 'Lexend', sans-serif; font-weight: 700; display: flex; align-items: center; justify-content: center\">1<\u002Fspan>\n<div><h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 4px 0 6px\">Escolha um modelo<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #33445F\">Cada modelo de previsão foi feito por um grupo diferente. A escolha fica salva no aparelho e pode ser trocada depois.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<img src=\"234efc43-6bbf-4478-abe8-d9ee9569c394\" alt=\"Tela de previsão: qualidade Moderada, 73 ms de tempo de resposta, 3,9% de perda de pacotes e a recomendação Reduza o uso de rede\" style=\"width: 100%; max-width: 250px; align-self: center\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"flex: 0 0 36px; height: 36px; border-radius: 50%; background: #1E5FAA; color: #FFFFFF; font-family: 'Lexend', sans-serif; font-weight: 700; display: flex; align-items: center; justify-content: center\">2<\u002Fspan>\n<div><h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 4px 0 6px\">Veja a previsão perto de você<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #33445F\">Com a sua permissão, o app encontra o ponto de medição mais próximo e mostra a qualidade, o tempo de resposta, a perda de pacotes e o que fazer.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<img src=\"edc73746-f436-4bf4-be44-f2831b1d3b58\" alt=\"Faixa das próximas horas com colunas coloridas por qualidade e o melhor horário em destaque\" style=\"width: 100%; max-width: 250px; align-self: center\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"flex: 0 0 36px; height: 36px; border-radius: 50%; background: #1E5FAA; color: #FFFFFF; font-family: 'Lexend', sans-serif; font-weight: 700; display: flex; align-items: center; justify-content: center\">3<\u002Fspan>\n<div><h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 4px 0 6px\">Confira as próximas horas<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #33445F\">A previsão hora a hora aparece em uma faixa, com o melhor horário em destaque. Um toque seleciona o horário que você quer.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<img src=\"8262c37e-e299-4efb-8243-aa6705280953\" alt=\"Verificação de chamada de vídeo às 15h com o resultado Melhor escolher outro horário\" style=\"width: 100%; max-width: 250px; align-self: center\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\">\n<span style=\"flex: 0 0 36px; height: 36px; border-radius: 50%; background: #1E5FAA; color: #FFFFFF; font-family: 'Lexend', sans-serif; font-weight: 700; display: flex; align-items: center; justify-content: center\">4<\u002Fspan>\n<div><h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 20px; margin: 4px 0 6px\">Pergunte se dá para fazer<\u002Fh3><p style=\"margin: 0; font-size: 16px; color: #33445F\">Escolha a atividade e toque em verificar. O app responde “Bom momento para isso” ou “Melhor escolher outro horário”.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"qualidade\" aria-labelledby=\"qualidade-titulo\" style=\"background: #FFFFFF; padding: 88px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px\">\n<h2 id=\"qualidade-titulo\" style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px\">Boa, Moderada ou Instável<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 42em; color: #33445F\">Em vez de números soltos, a previsão vira uma de três palavras. Elas vêm de duas medidas da rede: o tempo de resposta, que é quanto um sinal leva para ir e voltar, e a perda de pacotes, que é quanto da informação se perde no caminho. A pior das duas decide a qualidade.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; border-radius: 20px; overflow: hidden\">\n<div style=\"flex: 1 1 260px; min-width: 0; background: #187264; color: #FFFFFF; padding: 30px 28px\">\n<div style=\"display: flex; align-items: flex-end; gap: 5px; height: 30px; margin-bottom: 18px\" aria-hidden=\"true\"><span style=\"width: 9px; height: 12px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 20px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 30px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 32px; margin: 0 0 6px\">Boa<\u002Fh3>\n<p style=\"margin: 0 0 16px; font-size: 17px\">Conexão prevista adequada para qualquer atividade.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; color: #E2F4EF\">Menos de 60 ms de tempo de resposta e menos de 1% de perda.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; background: #A86412; color: #FFFFFF; padding: 30px 28px\">\n<div style=\"display: flex; align-items: flex-end; gap: 5px; height: 30px; margin-bottom: 18px\" aria-hidden=\"true\"><span style=\"width: 9px; height: 12px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 20px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 30px; background: rgba(255,255,255,0.35); border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 32px; margin: 0 0 6px\">Moderada<\u002Fh3>\n<p style=\"margin: 0 0 16px; font-size: 17px\">Pode haver instabilidade. O app sugere reduzir o uso de rede.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; color: #FBEBD6\">De 60 a 149 ms, ou de 1% a menos de 5% de perda.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; background: #B8323F; color: #FFFFFF; padding: 30px 28px\">\n<div style=\"display: flex; align-items: flex-end; gap: 5px; height: 30px; margin-bottom: 18px\" aria-hidden=\"true\"><span style=\"width: 9px; height: 12px; background: #FFFFFF; border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 20px; background: rgba(255,255,255,0.35); border-radius: 3px\"><\u002Fspan><span style=\"width: 9px; height: 30px; background: rgba(255,255,255,0.35); border-radius: 3px\"><\u002Fspan><\u002Fdiv>\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 32px; margin: 0 0 6px\">Instável<\u002Fh3>\n<p style=\"margin: 0 0 16px; font-size: 17px\">Risco de quedas. O app sugere preparar conteúdo offline.<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; color: #FBE3E5\">150 ms ou mais, ou 5% de perda ou mais.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 24px 0 0; font-size: 16px; color: #33445F; max-width: 46em\">No app, a qualidade nunca depende só da cor: a palavra, as barrinhas de sinal e a cor aparecem sempre juntas.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"atividades\" aria-labelledby=\"atividades-titulo\" style=\"padding: 88px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 460px; min-width: 0\">\n<h2 id=\"atividades-titulo\" style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px\">Vai dar para fazer?<\u002Fh2>\n<p style=\"margin: 0 0 28px; color: #33445F\">Cada atividade exige uma qualidade mínima. O app compara a previsão do horário escolhido com essa exigência.<\u002Fp>\n<div style=\"overflow-x: auto\">\n<table style=\"width: 100%; border-collapse: collapse; font-size: 17px; min-width: 360px\">\n<caption style=\"text-align: left; font-size: 15px; color: #4A5B78; padding-bottom: 10px\">Qualidade mínima de cada atividade<\u002Fcaption>\n<thead>\n<tr><th scope=\"col\" style=\"text-align: left; padding: 12px 14px; border-bottom: 2px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 600\">Atividade<\u002Fth><th scope=\"col\" style=\"text-align: left; padding: 12px 14px; border-bottom: 2px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 600\">Precisa de<\u002Fth><\u002Ftr>\n<\u002Fthead>\n<tbody>\n<tr><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Chamada de vídeo<\u002Ftd><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #187264\">Boa<\u002Fstrong><\u002Ftd><\u002Ftr>\n<tr><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Streaming<\u002Ftd><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #187264\">Boa<\u002Fstrong><\u002Ftd><\u002Ftr>\n<tr><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Chamada de voz<\u002Ftd><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #8F540E\">Moderada<\u002Fstrong> ou melhor<\u002Ftd><\u002Ftr>\n<tr><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Envio de arquivos<\u002Ftd><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #8F540E\">Moderada<\u002Fstrong> ou melhor<\u002Ftd><\u002Ftr>\n<tr><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\">Navegação<\u002Ftd><td style=\"padding: 12px 14px; border-bottom: 1px solid #D9E2EE\"><strong style=\"color: #8F540E\">Moderada<\u002Fstrong> ou melhor<\u002Ftd><\u002Ftr>\n<tr><td style=\"padding: 12px 14px\">Mensagens<\u002Ftd><td style=\"padding: 12px 14px\">Qualquer qualidade<\u002Ftd><\u002Ftr>\n<\u002Ftbody>\n<\u002Ftable>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center\">\n<img src=\"8262c37e-e299-4efb-8243-aa6705280953\" alt=\"Resultado da verificação: chamada de vídeo às 15h, qualidade prevista Instável, melhor escolher outro horário\" style=\"width: 46%; min-width: 180px; max-width: 250px\">\n<img src=\"44d75aa6-56b4-428a-9407-6d192e903849\" alt=\"Comparação dos modelos A, B, C e D para o mesmo horário, sem declarar vencedor\" style=\"width: 46%; min-width: 180px; max-width: 250px\">\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width: 1160px; margin: 40px auto 0; padding: 0 24px\">\n<p style=\"margin: 0; max-width: 46em; color: #33445F\">Na dúvida, compare: o app mostra o que os quatro modelos preveem para o mesmo local e horário, lado a lado, sem eleger um vencedor. As diferenças mostram como as abordagens divergem, não qual está certa.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tecnologia\" aria-labelledby=\"tecnologia-titulo\" style=\"background: #13294B; color: #FFFFFF; padding: 88px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px\">\n<h2 id=\"tecnologia-titulo\" style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: clamp(30px, 3.2vw, 42px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px\">Por dentro do NetPrevê<\u002Fh2>\n<p style=\"margin: 0 0 40px; max-width: 44em; color: #DCE7F7\">O produto tem duas partes: o aplicativo, que o usuário usa, e a API, que guarda as previsões e aplica as regras de qualidade.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; align-items: stretch; gap: 16px\">\n<div style=\"flex: 1 1 260px; min-width: 0; border: 2px solid #3E5C8A; border-radius: 18px; padding: 24px\">\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 22px; margin: 0 0 8px\">Aplicativo<\u002Fh3>\n<p style=\"margin: 0 0 14px; color: #DCE7F7; font-size: 16px\">React Native com Expo. Roda no Android, no iPhone e no navegador. Um único serviço conversa com a API, com tempo limite de 60 segundos e mensagens de erro que dizem o que fazer.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #B9CBE6\">React Native, Expo, JavaScript, expo-location<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0 4px\" aria-hidden=\"true\">\n<svg width=\"40\" height=\"24\" viewBox=\"0 0 40 24\" fill=\"none\" stroke=\"#8DB8F2\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12h34M28 4l8 8-8 8\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; border: 2px solid #3E5C8A; border-radius: 18px; padding: 24px\">\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 22px; margin: 0 0 8px\">API de previsão<\u002Fh3>\n<p style=\"margin: 0 0 14px; color: #DCE7F7; font-size: 16px\">Java com Spring Boot, em camadas: o controller recebe o pedido, o service aplica as regras de classificação e o repository lê e valida os dados.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #B9CBE6\">Java 17, Spring Boot, Maven, REST em /api/v1<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; border: 2px solid #3E5C8A; border-radius: 18px; padding: 24px\">\n<h3 style=\"font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 22px; margin: 0 0 8px\">Qualidade e documentação<\u002Fh3>\n<p style=\"margin: 0 0 14px; color: #DCE7F7; font-size: 16px\">Contrato documentado com Swagger, testes automatizados com JUnit e Mockito e cobertura medida com JaCoCo. O README de cada repositório explica como rodar.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #B9CBE6\">Swagger, JUnit, Mockito, JaCoCo, GitHub, Jira<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 40px; padding: 22px 24px; border-radius: 16px; background: #1D3A66; display: flex; gap: 16px; align-items: flex-start\">\n<svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFD27A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: 0 0 auto; margin-top: 2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5M12 16.5v.5\"><\u002Fpath><\u002Fsvg>\n<p style=\"margin: 0; color: #EAF1FB; font-size: 17px\"><strong>Os dados são de exemplo.<\u002Fstrong> Nesta versão acadêmica, a API usa previsões fixas e fictícias. A previsão é ligada a um ponto de medição de referência e não mede a rede do seu aparelho, e o app mostra esse aviso na tela.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"equipe\" aria-label=\"Equipe\" style=\"padding: 88px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 40px 72px\">\n<ul style=\"flex: 1 1 420px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column\">\n<li style=\"padding: 16px 0; border-bottom: 1px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Daniel da Silva Dornelas<\u002Fli>\n<li style=\"padding: 16px 0; border-bottom: 1px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Melissa Alves dos Santos<\u002Fli>\n<li style=\"padding: 16px 0; border-bottom: 1px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Samuel Conceição de Souza<\u002Fli>\n<li style=\"padding: 16px 0; border-bottom: 1px solid #C7D3E3; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Vinícius Araújo Alves<\u002Fli>\n<li style=\"padding: 16px 0; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 20px\">Alexander Penninches Iwanami<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #0E1F3A; color: #DCE7F7; padding: 40px 0\">\n<div style=\"max-width: 1160px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px\">\n<p style=\"margin: 0; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 20px; color: #FFFFFF\">NetPrevê<\u002Fp>\n<nav aria-label=\"Repositórios\" style=\"display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 16px\">\n<a href=\"https://github.com/DanielDornelas/netpreve-app\" style=\"color: #BFD6F7\">Repositório do aplicativo<\u002Fa>\n<a href=\"https://github.com/DanielDornelas/connectivity-forecast-squad-15\" style=\"color: #BFD6F7\">Repositório da API<\u002Fa>\n<\u002Fnav>\n<p style=\"margin: 0; font-size: 15px; color: #A9BCD8\">Projeto acadêmico, licença MIT.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1E5FAA&quot;,&quot;options&quot;:[&quot;#1E5FAA&quot;,&quot;#187264&quot;,&quot;#13294B&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:6400}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    var MOD = '#D98A1F', INS = '#C8434F';\n    var raw = [\n      { label: '13h', ms: '76 ms', color: MOD, height: '66%' },\n      { label: '14h', ms: '82 ms', color: MOD, height: '66%' },\n      { label: '15h', ms: '86 ms', color: INS, height: '33%' },\n      { label: '16h', ms: '88 ms', color: INS, height: '33%' },\n      { label: '17h', ms: '82 ms', color: INS, height: '33%' },\n      { label: '18h', ms: '81 ms', color: MOD, height: '66%' }\n    ];\n    var hours = raw.map(function (h) {\n      return { label: h.label, ms: h.ms, color: h.color, height: h.height };\n    });\n    return { accent: this.props.accent ?? '#1E5FAA', hours: hours };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
